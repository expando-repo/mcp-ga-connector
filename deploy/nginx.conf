server {
    listen 80;
    server_name mcp.vasedomena.cz;
    # Let's Encrypt přesměrování (certbot to doplní automaticky)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mcp.vasedomena.cz;

    # SSL certifikáty (certbot je doplní automaticky)
    ssl_certificate     /etc/letsencrypt/live/mcp.vasedomena.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.vasedomena.cz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # SSE vyžaduje vypnuté buffering!
    proxy_buffering off;
    proxy_cache off;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE - dlouhé spojení, bez timeoutu
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 60s;

        # CORS hlavičky pro Claude.ai
        add_header Access-Control-Allow-Origin "https://claude.ai" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
}
